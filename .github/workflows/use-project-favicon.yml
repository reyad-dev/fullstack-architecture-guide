name: Use project favicon
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/use-project-favicon.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch both guide files to the project favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','fullstack-architecture-guide.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('href="assets/favicon.svg" type="image/svg+xml"','href="assets/repo-icon.svg?v=2" type="image/svg+xml"')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fullstack-architecture-guide.html
          git diff --cached --quiet && exit 0
          git commit -m "Use project icon as favicon"
          git push
